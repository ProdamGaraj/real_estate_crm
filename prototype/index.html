<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM застройщика — прототип по ТЗ</title>
<style>
:root{
  --primary:#126E63; --primary-light:#2E9487; --primary-dark:#0B4F47; --on-primary:#fff;
  --secondary:#243B53;
  --bg:#f4f6f8; --paper:#ffffff; --paper-2:#fafafa;
  --text:#212121; --text-2:#6b7280; --line:rgba(0,0,0,.12); --hover:rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.05);
  --success:#2e7d32; --success-bg:#e8f5e9;
  --warning:#ed6c02; --warning-bg:#fff4e5;
  --error:#c62828;   --error-bg:#fdecea;
  --info:#0277bd;    --info-bg:#e5f3fb;
  --neutral:#546e7a; --neutral-bg:#eceff1;
  --st-free:#43a047; --st-book:#fb8c00; --st-proc:#1e88e5; --st-sold:#5e35b1; --st-res:#8d6e63; --st-off:#90a4ae;
  --drawer:264px; --bar:64px;
}
html[data-theme="dark"]{
  --primary:#4FB3A4; --primary-light:#6FC7BA; --primary-dark:#2E9487; --on-primary:#06231f;
  --secondary:#8fa9c0;
  --bg:#121212; --paper:#1e1e1e; --paper-2:#252525;
  --text:rgba(255,255,255,.95); --text-2:rgba(255,255,255,.65); --line:rgba(255,255,255,.12); --hover:rgba(255,255,255,.06);
  --shadow:0 4px 12px rgba(0,0,0,.3);
  --success:#81c784; --success-bg:#1e3327;
  --warning:#ffb74d; --warning-bg:#3a2f1a;
  --error:#ef9a9a;   --error-bg:#3a2122;
  --info:#64b5f6;    --info-bg:#16293a;
  --neutral:#b0bec5; --neutral-bg:#2a3136;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- shell ---------- */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar);background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;gap:14px;padding:0 18px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar .burger{display:none;background:none;border:0;cursor:pointer;padding:6px;border-radius:8px}
.bar .burger:hover{background:rgba(255,255,255,.14)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:rgba(255,255,255,.17);
  display:grid;place-items:center}
.brand b{font-size:16px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.15}
.brand span{font-size:11px;opacity:.82;display:block;line-height:1.2}
.bar .spacer{flex:1}
.bar .tools{display:flex;align-items:center;gap:6px}
.iconbtn{background:none;border:0;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.bar .iconbtn:hover{background:rgba(255,255,255,.14)}
.langsw{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
.langsw button{background:none;border:0;cursor:pointer;padding:5px 10px;font-size:12px;font-weight:600;opacity:.75}
.langsw button.on{background:rgba(255,255,255,.22);opacity:1}
.who{display:flex;align-items:center;gap:9px;padding-left:8px;border-left:1px solid rgba(255,255,255,.28);margin-left:4px}
.who .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:13px}
.who .n{font-size:13px;font-weight:600;line-height:1.2}
.who .r{font-size:11px;opacity:.82;line-height:1.2}

.drawer{position:fixed;top:var(--bar);bottom:0;left:0;width:var(--drawer);background:var(--paper);
  border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 28px;z-index:20}
.navgroup{padding:16px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text-2)}
.navitem{display:flex;align-items:center;gap:13px;padding:9px 18px;margin:1px 8px;border-radius:8px;cursor:pointer;
  border:0;background:none;width:calc(100% - 16px);text-align:left;color:var(--text)}
.navitem:hover{background:var(--hover)}
.navitem.on{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-weight:600}
.navitem .ic{width:20px;height:20px;flex:0 0 20px;opacity:.8}
.navitem.on .ic{opacity:1}
.navitem .tx{flex:1;font-size:14px}
.navitem .code{font-size:10px;font-family:ui-monospace,Consolas,monospace;color:var(--text-2);opacity:.85}

main{margin:var(--bar) 0 0 var(--drawer);padding:22px 26px 70px;min-height:calc(100vh - var(--bar))}
.scrim{display:none;position:fixed;inset:var(--bar) 0 0 0;background:rgba(0,0,0,.45);z-index:19}
@media(max-width:1000px){
  .bar .burger{display:grid;place-items:center}
  .drawer{transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  body.nav-open .drawer{transform:none}
  body.nav-open .scrim{display:block}
  main{margin-left:0;padding:16px 14px 70px}
  .who .n,.who .r{display:none}
}

/* ---------- page head ---------- */
.head{margin-bottom:18px}
.head .crumb{font-size:12px;color:var(--text-2);margin-bottom:5px}
.head h1{font-size:23px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head p{margin:0;color:var(--text-2);font-size:13px;max-width:900px}
.reqs{display:flex;gap:5px;flex-wrap:wrap}
.req{font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:2px 7px;border-radius:5px;
  background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:600;white-space:nowrap}

/* ---------- surfaces ---------- */
.paper{background:var(--paper);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sect{padding:16px 18px}
.sect>h3{margin:0 0 2px;font-size:15px;font-weight:600}
.sect>h3+.hint{margin:0 0 14px}
.hint{font-size:12px;color:var(--text-2);margin:0 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2-1{grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,260px)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-1-2-1{grid-template-columns:1fr}}
@media(max-width:900px){.g2,.g3,.g-2-1{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mb{margin-bottom:16px}

/* ---------- kpi ---------- */
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.kpi:hover{border-color:var(--primary)}
.kpi .t{font-size:12px;color:var(--text-2);line-height:1.35}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.4px}
.kpi .s{font-size:12px;color:var(--text-2)}
.kpi .d{font-size:12px;font-weight:600}
.kpi .d.up{color:var(--success)} .kpi .d.down{color:var(--error)}
.kpi .go{position:absolute;top:12px;right:12px;font-size:11px;color:var(--primary);opacity:0;font-weight:600}
.kpi:hover .go{opacity:1}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.success{background:var(--success-bg);color:var(--success)}
.chip.warning{background:var(--warning-bg);color:var(--warning)}
.chip.error{background:var(--error-bg);color:var(--error)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--neutral-bg);color:var(--neutral)}
.chip.primary{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- table ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.t th{background:var(--paper-2);font-weight:600;font-size:12px;color:var(--text-2);text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:hover{background:var(--hover)}
table.t tr.total td{font-weight:700;background:var(--paper-2)}
table.t tr.group td{font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub td:first-child{padding-left:30px;color:var(--text-2)}
.link{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.muted{color:var(--text-2)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* ---------- controls ---------- */
.bar2{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fld{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;
  font-size:13px;background:var(--paper);cursor:pointer;color:var(--text)}
.fld .lb{color:var(--text-2);font-size:12px}
.fld b{font-weight:600}
.fld.on{border-color:var(--primary);color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;padding:8px 15px;font-size:13px;
  font-weight:600;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 45%,transparent)}
.btn.plain{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segs button{background:var(--paper);border:0;padding:7px 13px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.segs button:last-child{border-right:0}
.segs button.on{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 14px;font-size:13px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;color:var(--text-2);white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* ---------- misc blocks ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:baseline}
.kv dt{color:var(--text-2)} .kv dd{margin:0;font-weight:500}
.feed{position:relative;padding-left:26px}
.feed:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 17px}
.ev:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:2px solid var(--primary)}
.ev .m{font-size:11px;color:var(--text-2)}
.ev .x{font-size:13px}
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1;min-width:112px;padding:9px 11px;border:1px solid var(--line);border-right:0;font-size:12px;position:relative}
.step:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.step:first-child{border-radius:8px 0 0 8px}
.step .n{font-weight:600;font-size:12px}
.step .w{font-size:11px;color:var(--text-2)}
.step.done{background:var(--success-bg)} .step.done .n{color:var(--success)}
.step.now{background:color-mix(in srgb,var(--primary) 13%,transparent);border-color:var(--primary)} .step.now .n{color:var(--primary)}
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:8px;font-size:13px;align-items:flex-start}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert.warn{background:var(--warning-bg);color:var(--warning)}
.alert.ok{background:var(--success-bg);color:var(--success)}
.alert b{font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:148px 1fr 78px;gap:11px;align-items:center;font-size:13px}
.track{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--primary);border-radius:5px}
.fill.w{background:var(--warning)} .fill.e{background:var(--error)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* chessboard */
.cb{overflow-x:auto;padding:4px 2px 10px}
.cbrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.cbfl{width:40px;flex:0 0 40px;font-size:11px;color:var(--text-2);text-align:right;padding-right:4px}
.cell{width:84px;flex:0 0 84px;height:52px;border-radius:7px;padding:5px 7px;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;border:2px solid transparent}
.cell:hover{outline:2px solid var(--text);outline-offset:1px}
.cell .u{font-size:12px;font-weight:700;line-height:1}
.cell .a{font-size:10px;opacity:.92;line-height:1}
.cell .p{font-size:10px;opacity:.92;line-height:1;font-variant-numeric:tabular-nums}
.cell.sel{border-color:var(--text)}

/* kanban */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 212px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:9px}
.col h4{margin:0 0 2px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.col .cnt{color:var(--text-2);font-weight:600}
.col .own{font-size:10px;color:var(--text-2);margin-bottom:8px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px;margin-bottom:7px;cursor:pointer;font-size:12px}
.dcard:hover{border-color:var(--primary)}
.dcard .nm{font-weight:600;margin-bottom:2px}
.dcard .mt{color:var(--text-2);font-size:11px}
.dcard .tg{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}

/* matrix */
.mx{overflow-x:auto}
table.mx-t{border-collapse:collapse;font-size:12px;width:100%;min-width:900px}
table.mx-t th{background:var(--paper-2);padding:8px 6px;border:1px solid var(--line);font-size:11px;font-weight:700}
table.mx-t th:first-child{text-align:left;min-width:250px;position:sticky;left:0;z-index:2}
table.mx-t td{padding:6px;border:1px solid var(--line);text-align:center;font-size:11px}
table.mx-t td:first-child{text-align:left;background:var(--paper);position:sticky;left:0;font-weight:500}
table.mx-t tr.hdr td{background:var(--paper-2);font-weight:700;text-align:left}
.v-yes{color:var(--success);font-weight:700}
.v-no{color:var(--text-2);opacity:.5}
.v-sc{color:var(--info);font-weight:600;font-size:10px}

/* heatmap */
.hm{display:grid;grid-template-columns:36px repeat(12,1fr);gap:3px;font-size:10px;min-width:560px}
.hm .hl{color:var(--text-2);display:grid;place-items:center}
.hm .hc{height:22px;border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:600}

/* roadmap */
.rm{display:grid;gap:12px}
.rmi{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.rmi .ph{font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;text-align:center}
.footnote{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--text-2)}
.demo-pill{position:fixed;right:16px;bottom:16px;background:var(--secondary);color:#fff;font-size:11px;font-weight:600;
  padding:7px 13px;border-radius:20px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:.92}
html[data-theme="dark"] .demo-pill{background:var(--paper-2);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="bar">
  <button class="burger" onclick="document.body.classList.toggle('nav-open')" aria-label="Меню">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <div class="brand">
    <div class="mark">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 21V11l5-3v13H3zm6 0V6l6-3.5V21H9zm7 0V9l5 3v9h-5z" opacity=".95"/>
      </svg>
    </div>
    <div><b id="brandName">CRM Застройщика</b><span id="brandSub">прототип по техническому заданию</span></div>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <div class="langsw">
      <button id="lng-uz" onclick="setLang('uz')">UZ</button>
      <button id="lng-ru" class="on" onclick="setLang('ru')">RU</button>
    </div>
    <button class="iconbtn" onclick="toggleTheme()" title="Тема" aria-label="Тема">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a6 6 0 1 1 0-12v12z"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
    <button class="iconbtn" title="Уведомления" aria-label="Уведомления">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-1.5 2v1h17v-1L19 16z"/></svg>
    </button>
    <div class="who">
      <div class="av">ТА</div>
      <div><div class="n">Тимур Азизов</div><div class="r" id="roleLabel">Директор</div></div>
    </div>
  </div>
</div>

<nav class="drawer" id="drawer"></nav>
<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<main id="main"></main>
<div class="demo-pill" id="demoPill">Демо-данные · прототип</div>

<script>
/* =====================================================================
   Прототип CRM застройщика по ТЗ от 06.11.2026.
   Данные демонстрационные; числа взяты из примеров самого ТЗ, чтобы
   заказчик узнавал свой документ. Логика не реализована — это макет.
   Бренд и цвет меняются в BRAND и в переменных :root выше.
   ===================================================================== */

const BRAND = { name:'CRM Застройщика', sub:'прототип по техническому заданию' };

/* ---------- словарь для переключателя языка (АД-02) ---------- */
const UZ = {
  'Дашборд':'Boshqaruv paneli','Шахматка':'Shaxmatka','Карточка помещения':'Xona kartasi',
  'Остатки':'Qoldiqlar','Воронка сделок':'Bitimlar varonkasi','Карточка сделки':'Bitim kartasi',
  'Обращения':'Murojaatlar','Бронь и скидки':'Band qilish va chegirmalar','Договоры':'Shartnomalar',
  'Калькулятор оплаты':'Toʻlov kalkulyatori','График платежей':'Toʻlov jadvali','Дебиторка':'Debitorlik',
  'Ипотека':'Ipoteka','Взыскание долга':'Qarz undirish','Звонки и Telegram':'Qoʻngʻiroq va Telegram',
  'Отчёты':'Hisobotlar','Права и роли':'Huquq va rollar','Настраиваемые поля':'Sozlanadigan maydonlar',
  'Журнал действий':'Harakatlar jurnali','Этапы 2 и 3':'2 va 3-bosqich','О прототипе':'Prototip haqida',
  'Объекты':'Obyektlar','Лиды и воронка':'Lidlar va varonka','Финансы сделки':'Bitim moliyasi',
  'Коммуникации':'Kommunikatsiya','Администрирование':'Administratsiya','Обзор':'Umumiy',
  'Директор':'Direktor'
};
let LANG='ru';
const T = s => (LANG==='uz' && UZ[s]) ? UZ[s] : s;

/* ---------- хелперы разметки ---------- */
const money = n => n.toLocaleString('ru-RU');
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chip  = (t,k='neutral') => `<span class="chip ${k}">${t}</span>`;
const reqs  = a => `<span class="reqs">${a.map(r=>`<span class="req">${r}</span>`).join('')}</span>`;
const head  = (crumb,title,codes,desc) => `<div class="head">
    <div class="crumb">${esc(crumb)}</div>

  res :{n:'Резерв руководства',c:'var(--st-res)'},
  off :{n:'Не в продаже',c:'var(--st-off)'}
};
/* детерминированная раскладка дома: 16 этажей × 6 помещений */
function houseGrid(){
  const rows=[]; let seed=7;
  const rnd=()=> (seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let f=16;f>=1;f--){
    const cells=[];
    for(let u=1;u<=6;u++){
      const r=rnd(); let s;
      if(f<=3) s = r<.82?'sold':(r<.92?'proc':'off');
      else if(f<=8) s = r<.5?'sold':(r<.63?'proc':(r<.72?'book':'free'));
      else if(f>=15) s = r<.18?'res':(r<.3?'book':'free');
      else s = r<.26?'sold':(r<.37?'book':(r<.44?'proc':'free'));
      const rooms=[1,2,2,3,3,4][u-1];
      const area=[38.6,54.2,58.4,78.4,82.1,104.5][u-1];
      cells.push({f,u,n:f*10+u,s,rooms,area,price:Math.round(area*12.56)});
    }
    rows.push(cells);
  }
  return rows;
}
const HOUSE = houseGrid();
