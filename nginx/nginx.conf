# =============================================================================
# Основная конфигурация Nginx
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml 
               application/javascript application/json
               image/svg+xml;

    # Resolver для динамических upstream (Docker DNS)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # =================================================================
    # Rate Limiting зоны
    # =================================================================
    # Лимит на авторизацию: 5 запросов/сек на IP (burst 10)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    # Лимит на публичный API: 20 запросов/сек на IP (burst 40)
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
    # Общий лимит на все API: 50 запросов/сек на IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;

    # Подключение конфигурации сайта (HTTP или HTTPS)
    include /etc/nginx/conf.d/*.conf;
}
