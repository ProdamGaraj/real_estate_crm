# =============================================================================
# HTTP конфигурация (используется когда нет SSL сертификатов)
# =============================================================================

server {
    listen 80;
    server_name _;

    # Логи
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Переменные для динамического resolve
    set $backend_server backend:8000;
    set $frontend_server frontend:80;

    # API запросы -> Backend
    location /api/ {
        proxy_pass http://$backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Admin панель Django -> Backend
    location /admin/ {
        proxy_pass http://$backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Медиа файлы -> прямая отдача из volumes
    location /media/ {
        alias /app/media/;
        
        # Кэширование медиа файлов
        expires 1d;
        add_header Cache-Control "public";
        
        # Security: запрет на выполнение скриптов
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # Статические файлы Django -> Backend
    location /static/ {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Кэширование статики
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Все остальное -> Frontend
    location / {
        proxy_pass http://$frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
