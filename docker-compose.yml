services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Порт не выставлен наружу - доступ только из backend_network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # =============================================================================
  # Redis - Кеширование и rate limiting
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # =============================================================================
  # Backend Django API
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    volumes:
      # Медиа файлы (изображения, документы) - прямые пути на диск
      - ./backend/media/buildings:/app/media/buildings
      - ./backend/media/deals:/app/media/deals
      - ./backend/media/layouts:/app/media/layouts
      - ./backend/media/projects:/app/media/projects
      - ./backend/media/templates:/app/media/templates
      # Статические файлы Django
      - static_files:/app/staticfiles
      # Логи
      - backend_logs:/app/logs
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "8000"
    environment:
      # База данных
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      # Django settings
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — set it in .env file}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      # Redis (для кеширования и rate limiting)
      - REDIS_URL=redis://redis:6379/0
      # URLs
      - SITE_URL=${SITE_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Frontend React/Vite (Production с nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: crm_frontend
    restart: unless-stopped
    volumes:
      # Логи nginx
      - frontend_logs:/var/log/nginx
      - ./:/app
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "80"
    # Frontend изолирован в своей сети
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Nginx Reverse Proxy (HTTP/HTTPS)
  # Единственная точка входа - имеет доступ к обеим сетям
  # =============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      # Единственные порты, доступные снаружи
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # SSL сертификаты (опционально)
      # Положите fullchain.pem и privkey.pem в ./nginx/ssl/
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Для Let's Encrypt (опционально)
      - certbot_www:/var/www/certbot:ro
      # Логи
      - nginx_logs:/var/log/nginx
      # Media volumes - прямые пути на диск для прямой отдачи файлов
      - ./backend/media/buildings:/app/media/buildings:ro
      - ./backend/media/deals:/app/media/deals:ro
      - ./backend/media/layouts:/app/media/layouts:ro
      - ./backend/media/projects:/app/media/projects:ro
      - ./backend/media/templates:/app/media/templates:ro
    depends_on:
      - frontend
      - backend
    networks:
      # Nginx имеет доступ к обеим сетям
      - frontend_network
      - backend_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
  # PostgreSQL Backup - Автоматические бэкапы раз в неделю
  # =============================================================================
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: crm_db_backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      # Расписание: каждое воскресенье в 3:00 ночи
      - SCHEDULE=0 3 * * 0
      # Хранить 4 еженедельных бэкапа (1 месяц)
      - BACKUP_KEEP_WEEKS=4
      # Хранить 3 ежемесячных бэкапа
      - BACKUP_KEEP_MONTHS=3
      # Ежедневные бэкапы не нужны (0 = отключено)
      - BACKUP_KEEP_DAYS=0
      # Сжатие gzip
      - HEALTHCHECK_PORT=8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

# =============================================================================
# Volumes - Персистентное хранилище
# =============================================================================
volumes:
  # База данных PostgreSQL
  postgres_data:
    driver: local
  
  # Redis данные
  redis_data:
    driver: local
  
  # Статические файлы Django (CSS, JS для admin)
  static_files:
    driver: local
  
  # Логи
  backend_logs:
    driver: local
  frontend_logs:
    driver: local
  nginx_logs:
    driver: local
  
  # Let's Encrypt (опционально)
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

# =============================================================================
# Networks - Сетевое разделение для безопасности
# =============================================================================
networks:
  # Сеть для фронтенда (nginx <-> frontend)
  frontend_network:
    driver: bridge
  
  # Сеть для бэкенда и БД (nginx <-> backend <-> db)
  # internal: true - нет прямого доступа в интернет
  backend_network:
    driver: bridge
    internal: true
