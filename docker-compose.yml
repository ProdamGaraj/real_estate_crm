version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-real_estate_crm}
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password_2024}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # Backend Django (закомментирован для dev режима)
  # Для запуска в production режиме - раскомментируйте этот сервис
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: crm_backend
  #   restart: unless-stopped
  #   volumes:
  #     - ./backend:/app
  #     - media_data:/app/media
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - crm_network

  # Frontend React (закомментирован для dev режима)
  # Для запуска в production режиме - раскомментируйте этот сервис
  # frontend:
  #   build:
  #     context: ./frontend-new
  #     dockerfile: Dockerfile
  #   container_name: crm_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - crm_network

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  crm_network:
    driver: bridge
