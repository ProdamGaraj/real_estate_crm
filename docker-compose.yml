services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-real_estate_crm}
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password_2024}
    # Порт не выставлен наружу - доступ только из backend_network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user} -d ${DB_NAME:-real_estate_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # =============================================================================
  # Backend Django API
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    volumes:
      # Медиа файлы (изображения, документы) - доступны для изменения
      - media_buildings:/app/media/buildings
      - media_deals:/app/media/deals
      - media_layouts:/app/media/layouts
      - media_projects:/app/media/projects
      - media_templates:/app/media/templates
      # Статические файлы Django
      - static_files:/app/staticfiles
      # Логи
      - backend_logs:/app/logs
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "8000"
    environment:
      # База данных
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-real_estate_crm}
      - DB_USER=${DB_USER:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-crm_password_2024}
      - DB_HOST=db
      - DB_PORT=5432
      # Django settings
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      # URLs
      - SITE_URL=${SITE_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Frontend React/Vite (Production с nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: crm_frontend
    restart: unless-stopped
    volumes:
      # Логи nginx
      - frontend_logs:/var/log/nginx
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "80"
    # Frontend изолирован в своей сети
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Nginx Reverse Proxy (HTTP/HTTPS)
  # Единственная точка входа - имеет доступ к обеим сетям
  # =============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      # Единственные порты, доступные снаружи
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # SSL сертификаты (опционально)
      # Положите fullchain.pem и privkey.pem в ./nginx/ssl/
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Для Let's Encrypt (опционально)
      - certbot_www:/var/www/certbot:ro
      # Логи
      - nginx_logs:/var/log/nginx
      # Media volumes для прямой отдачи файлов
      - media_buildings:/app/media/buildings:ro
      - media_deals:/app/media/deals:ro
      - media_layouts:/app/media/layouts:ro
      - media_projects:/app/media/projects:ro
      - media_templates:/app/media/templates:ro
    depends_on:
      - frontend
      - backend
    networks:
      # Nginx имеет доступ к обеим сетям
      - frontend_network
      - backend_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Volumes - Персистентное хранилище
# =============================================================================
volumes:
  # База данных PostgreSQL
  postgres_data:
    driver: local
  
  # Медиа файлы backend (изображения, документы)
  # Каждая папка в отдельном volume для удобства управления
  media_buildings:
    driver: local
  media_deals:
    driver: local
  media_layouts:
    driver: local
  media_projects:
    driver: local
  media_templates:
    driver: local
  
  # Статические файлы Django (CSS, JS для admin)
  static_files:
    driver: local
  
  # Логи
  backend_logs:
    driver: local
  frontend_logs:
    driver: local
  nginx_logs:
    driver: local
  
  # Let's Encrypt (опционально)
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

# =============================================================================
# Networks - Сетевое разделение для безопасности
# =============================================================================
networks:
  # Сеть для фронтенда (nginx <-> frontend)
  frontend_network:
    driver: bridge
  
  # Сеть для бэкенда и БД (nginx <-> backend <-> db)
  # internal: true - нет прямого доступа в интернет
  backend_network:
    driver: bridge
    internal: true
