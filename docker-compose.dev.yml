# =============================================================================
# Docker Compose для разработки
# =============================================================================
# Использование: docker-compose -f docker-compose.dev.yml up
# 
# В режиме разработки:
# - Backend код монтируется напрямую (hot reload)
# - Frontend запускается в dev режиме с HMR
# - Volumes для медиа файлов доступны для редактирования
#
# Сетевое разделение для безопасности:
# - frontend_network: nginx <-> frontend (только фронтенд)
# - backend_network: nginx <-> backend <-> db (бэкенд и БД)
# - Frontend НЕ имеет прямого доступа к базе данных
# =============================================================================

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:16-alpine
    container_name: crm_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-real_estate_crm}
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password_2024}
    # Порт не выставлен наружу - доступ только из backend_network
    expose:
      - "5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network_dev

  # =============================================================================
  # Backend Django (Development)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: crm_backend_dev
    restart: unless-stopped
    volumes:
      # Исходный код - для hot reload
      - ./backend:/app
      # Медиа файлы - bind mount для прямого доступа
      - ./backend/media/buildings:/app/media/buildings
      - ./backend/media/deals:/app/media/deals
      - ./backend/media/layouts:/app/media/layouts
      - ./backend/media/projects:/app/media/projects
      - ./backend/media/templates:/app/media/templates
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "8000"
    environment:
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-real_estate_crm}
      - DB_USER=${DB_USER:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-crm_password_2024}
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0,nginx
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network_dev

  # =============================================================================
  # Frontend React/Vite (Development с HMR)
  # =============================================================================
  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile.dev
    container_name: crm_frontend_dev
    restart: unless-stopped
    volumes:
      # Исходный код - для hot reload
      - ./frontend-new:/app
      # Исключаем node_modules
      - /app/node_modules
    # Порт не выставлен наружу - доступ только через nginx
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/api
    # Frontend не зависит напрямую от backend (нет доступа к сети backend)
    networks:
      - frontend_network_dev

  # =============================================================================
  # Nginx Reverse Proxy (Development)
  # Единственная точка входа - имеет доступ к обеим сетям
  # =============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: crm_nginx_dev
    restart: unless-stopped
    ports:
      # Единственные порты, доступные снаружи
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DEV_MODE=true
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs_dev:/var/log/nginx
      # Media volumes для прямой отдачи файлов
      - ./backend/media:/app/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      # Nginx имеет доступ к обеим сетям
      - frontend_network_dev
      - backend_network_dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data_dev:
    driver: local
  nginx_logs_dev:
    driver: local

# =============================================================================
# Networks - Сетевое разделение для безопасности
# =============================================================================
networks:
  # Сеть для фронтенда (nginx <-> frontend)
  frontend_network_dev:
    driver: bridge
  
  # Сеть для бэкенда и БД (nginx <-> backend <-> db)
  # internal: true - нет прямого доступа в интернет
  backend_network_dev:
    driver: bridge
    internal: true
